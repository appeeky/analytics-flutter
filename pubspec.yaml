name: appeeky_analytics
description: >-
  Appeeky Analytics for Flutter: installs, sessions, screens and events, with
  revenue tied to the install source (Apple Search Ads, smart links, Play
  referrer, organic).
version: 0.1.0
homepage: https://appeeky.com
repository: https://github.com/appeeky/analytics-flutter
documentation: https://docs.appeeky.com/docs/analytics-overview

environment:
  sdk: ">=3.10.0 <4.0.0"
  # 3.38 added scene lifecycle events for plugins (UIScene apps on iOS).
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.appeeky.analytics
        pluginClass: AppeekyAnalyticsPlugin
      ios:
        pluginClass: AppeekyAnalyticsPlugin
